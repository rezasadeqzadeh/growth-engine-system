<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ (brand or {}).get('display_name', '') }}{% endblock %}</title>
{% block meta %}{% endblock %}
<style>
@font-face { font-family: "Vazirmatn"; src: url("/fonts/Vazirmatn-Regular.ttf"); font-weight: 400; font-display: swap; }
@font-face { font-family: "Vazirmatn"; src: url("/fonts/Vazirmatn-Black.ttf"); font-weight: 900; font-display: swap; }
:root {
  --brand: {{ (brand or {}).get('primary_color', '#8B5E3C') }};
  --bg: #faf7f2; --surface: #ffffff; --text: #2a2420; --muted: #75695f; --line: #e8e0d6;
  --ok: #2f7d4f; --bad: #b3261e;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.8 "Vazirmatn", Tahoma, sans-serif; }
main { max-width: 640px; margin: 0 auto; padding: 24px 16px 64px; }
h1 { font-size: 1.5rem; line-height: 1.5; margin: 0 0 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; margin: 16px 0; }
.muted { color: var(--muted); }
label { display: block; margin: 14px 0 6px; font-weight: 600; }
input[type=text], input[type=tel], textarea { width: 100%; padding: 12px; border: 1px solid var(--line); border-radius: 10px; font: inherit; background: #fff; }
.check { display: flex; gap: 8px; align-items: flex-start; font-weight: 400; }
.btn { display: block; width: 100%; padding: 14px; margin-top: 18px; border: 0; border-radius: 12px; background: var(--brand); color: #fff; font: inherit; font-weight: 700; text-align: center; text-decoration: none; cursor: pointer; }
.btn.secondary { background: transparent; color: var(--brand); border: 2px solid var(--brand); }
.error { color: var(--bad); font-weight: 600; }
.done { color: var(--ok); font-weight: 600; }
video, img.cover { width: 100%; border-radius: 12px; background: #000; display: block; }
.grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.grid a { color: inherit; text-decoration: none; }
.footer { text-align: center; margin-top: 32px; font-size: .85rem; }
</style>
</head>
<body>
<main>
{% block body %}{% endblock %}
<p class="footer muted">{{ (brand or {}).get('display_name', '') }}</p>
</main>
{% block script %}{% endblock %}
</body>
</html>
